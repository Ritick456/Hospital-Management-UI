<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">✏️ Edit Appointment</h2>

    <!-- 🔴 Error Message Section -->
    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.964 0L.165 13.233c-.457.778.091 1.767.982 1.767h13.707c.89 0 1.438-.99.982-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1-2.002 0 1 1 0 0 1 2.002 0z"/>
        </svg>
        <span th:text="${errorMessage}">Error placeholder</span>
    </div>

    <form th:action="@{/appointments/edit}" th:object="${appointment}" method="post" class="card p-4 shadow rounded bg-white">

        <!-- Hidden Appointment ID -->
        <input type="hidden" th:field="*{appointmentId}" />

        <!-- 🕒 Start Time -->
        <div class="mb-3">
            <label for="start" class="form-label">Start Time</label>
            <input type="datetime-local" th:field="*{start}" class="form-control" id="start" required>
        </div>

        <!-- 🕔 End Time -->
        <div class="mb-3">
            <label for="end" class="form-label">End Time</label>
            <input type="datetime-local" th:field="*{end}" class="form-control" id="end" required>
        </div>

        <!-- 🏥 Examination Room -->
        <div class="mb-3">
            <label for="examinationRoom" class="form-label">Examination Room</label>
            <input type="text" th:field="*{examinationRoom}" class="form-control" id="examinationRoom" required>
        </div>

        <!-- 👨‍⚕️ Physician Name -->
        <div class="mb-3">
            <label for="physicianName" class="form-label">Physician Name</label>
            <input type="text" th:field="*{physician.name}" class="form-control" id="physicianName" required>
        </div>

        <!-- 👩‍⚕️ Nurse Name -->
        <div class="mb-3">
            <label for="nurseName" class="form-label">Nurse Name</label>
            <input type="text" th:field="*{nurse.name}" class="form-control" id="nurseName">
        </div>

        <!-- 🧑 Patient Name -->
        <div class="mb-3">
            <label for="patientName" class="form-label">Patient Name</label>
            <input type="text" th:field="*{patient.name}" class="form-control" id="patientName" required>
        </div>

        <!-- 🔘 Action Buttons -->
        <div class="d-flex justify-content-between">
            <a th:href="@{/appointments}" class="btn btn-secondary">⬅ Back</a>
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        </div>

    </form>
</div>

</body>
</html>
