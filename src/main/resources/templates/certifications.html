<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Certifications</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1400px; }
        .card { border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-custom { margin-right: 10px; }
        .table th, .table td { vertical-align: middle; }
        .pagination { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container mt-5 mb-5">
    <h1 class="mb-4 text-primary">Certifications</h1>

    <!-- Success / Error messages -->
    <div th:if="${message}"  class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}"    class="alert alert-danger"  th:text="${error}"></div>

    <!-- ====== FORM SECTION ====== -->
    <div class="card p-4 mb-4">
        <div class="row gy-3">

            <!-- 1️⃣ Search by Date -->
            <div class="col-md-6">
                <form th:action="@{/trainedIn/dates}" method="get" class="row gx-2 align-items-end">
                    <input type="hidden" name="filterType" value="dates"/>
                    <div class="col-auto">
                        <label for="startDate" class="form-label mb-0">Start:</label>
                        <input type="datetime-local" id="startDate" name="startDate"
                               class="form-control"
                               th:value="${startDateStr}" required/>
                    </div>
                    <div class="col-auto">
                        <label for="endDate" class="form-label mb-0">End:</label>
                        <input type="datetime-local" id="endDate" name="endDate"
                               class="form-control"
                               th:value="${endDateStr}" required/>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </div>
                </form>
            </div>

            <!-- 2️⃣ Filter by Physician -->
            <div class="col-md-6">
                <form th:action="@{/trainedIn/physicians}" method="get" class="row gx-2 align-items-end">
                    <input type="hidden" name="filterType"    value="physicians"/>
                    <label for="physicianId" class="col-form-label mb-0">Physician:</label>
                    <div class="col-auto">
                        <select name="physicianId" id="physicianId" class="form-select" required>
                            <option value="" disabled selected>Select...</option>
                            <option th:each="phys : ${physicians}"
                                    th:value="${phys.employeeId}"
                                    th:text="${phys.name}">
                            </option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Filter</button>
                    </div>
                </form>
            </div>

        </div>

        <!-- 3️⃣ Add New Certification -->
        <div class="row mt-3">
            <div class="col text-end">
                <a th:href="@{/trainedIn/add}" class="btn btn-success">Add New Certification</a>
            </div>
        </div>
    </div>

    <!-- ====== CERTIFICATIONS TABLE ====== -->
    <div th:if="${not #lists.isEmpty(appointments)}" class="card">
        <div class="card-body p-0">

            <!-- Table for Date Search Results (TrainedInPostDTO) -->
            <table th:if="${filterType == 'dates'}" class="table table-striped table-bordered mb-0">
                <thead class="thead-dark">
                <tr>
                    <th>Physician</th>
                    <th>Position</th>
                    <th>Procedure</th>
                    <th>Cost</th>
                    <th>Cert. Date</th>
                    <th>Expires</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cert : ${appointments}">
                    <td th:text="${cert.physician.name}"></td>
                    <td th:text="${cert.physician.position}"></td>
                    <td th:text="${cert.procedure.name}"></td>
                    <td th:text="${cert.procedure.cost}"></td>
                    <td th:text="${#temporals.format(cert.certificationDate,'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${#temporals.format(cert.certificationExpires,'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/trainedIn/certifications/edit/{physicianId}/{procedureId}(
                                        physicianId=${cert.physician.employeeId},
                                        procedureId=${cert.procedure.code})}"
                           class="btn btn-sm btn-primary">
                            Edit
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Table for Physician Filter Results (ProcedureDTO) -->
            <table th:if="${filterType == 'physicians'}" class="table table-striped table-bordered mb-0">
                <thead class="thead-dark">
                <tr>
                    <th>Procedure Code</th>
                    <th>Procedure Name</th>
                    <th>Cost</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="procedure : ${appointments}">
                    <td th:text="${procedure.code}"></td>
                    <td th:text="${procedure.name}"></td>
                    <td th:text="${procedure.cost}"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
    <div th:unless="${not #lists.isEmpty(appointments)}" class="alert alert-info mt-3">
        Please search by date or filter by physician to see certifications.
    </div>

    <!-- ====== PAGINATION ====== -->
    <nav aria-label="Page navigation" th:if="${not #lists.isEmpty(appointments)}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageResponse.first} ? 'disabled'">
                <!-- Prev when filtering by physician -->
                <a class="page-link"
                   th:if="${filterType == 'physicians'}"
                   th:href="@{/trainedIn/physicians(
           page=${pageResponse.pageNumber - 1},
           size=${pageResponse.pageSize},
           physicianId=${selectedPhysicianId})}">
                    «
                </a>
                <!-- Prev when searching by dates -->
                <a class="page-link"
                   th:if="${filterType != 'physicians'}"
                   th:href="@{/trainedIn/dates(
           page=${pageResponse.pageNumber - 1},
           size=${pageResponse.pageSize},
           startDate=${startDateStr},
           endDate=${endDateStr})}">
                    «
                </a>
            </li>

            <li class="page-item" th:classappend="${pageResponse.last} ? 'disabled'">
                <!-- Next when filtering by physician -->
                <a class="page-link"
                   th:if="${filterType == 'physicians'}"
                   th:href="@{/trainedIn/physicians(
           page=${pageResponse.pageNumber + 1},
           size=${pageResponse.pageSize},
           physicianId=${selectedPhysicianId})}">
                    »
                </a>
                <!-- Next when searching by dates -->
                <a class="page-link"
                   th:if="${filterType != 'physicians'}"
                   th:href="@{/trainedIn/dates(
           page=${pageResponse.pageNumber + 1},
           size=${pageResponse.pageSize},
           startDate=${startDateStr},
           endDate=${endDateStr})}">
                    »
                </a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
