<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Certifications</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1400px; }
        .card { border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-custom { margin-right: 10px; }
        .table th, .table td { vertical-align: middle; }
        .pagination { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container mt-5 mb-5">
    <h1 class="mb-4 text-primary">Certifications</h1>
<!--    <div th:if="${message}" class="alert alert-success">"Certificate Updated Successfully!"</div>-->
<!--    <div th:if="${error}" class="alert alert-danger">"Failed to update Certificate!"</div>-->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <!-- Form Section -->

    <div class="card p-4 mb-4">
        <form th:action="@{/trainedIn/dates}" method="get">
            <div class="row align-items-end">
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="startDate">Start Date:</label>
                        <input type="datetime-local" id="startDate" name="startDate" class="form-control" th:value="${startDateStr}" required />
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="endDate">End Date:</label>
                        <input type="datetime-local" id="endDate" name="endDate" class="form-control" th:value="${endDateStr}" required />
                    </div>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="filter1">Filter 1:</label>
                        <select id="filter1" name="filter1" class="form-control">
                            <option value="">Select Option</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary mt-2">Filter 1</button>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="filter2">Filter 2:</label>
                        <select id="filter2" name="filter2" class="form-control">
                            <option value="">Select Option</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary mt-2">Filter 2</button>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 text-right">
                    <a th:href="@{/trainedIn/add}" class="btn btn-success">Add New Certification</a>
                </div>
            </div>
        </form>
    </div>

    <!-- Certifications Table -->
    <div th:if="${not #lists.isEmpty(appointments)}" class="card">
        <div class="card-body p-0">
            <table class="table table-striped table-bordered mb-0">
                <thead class="thead-dark">
                <tr>
                    <th>Physician Name</th>
                    <th>Position</th>
                    <th>Procedure Name</th>
                    <th>Cost</th>
                    <th>Certification Date</th>
                    <th>Certification Expires</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cert : ${appointments}">
                    <td th:text="${cert.physician.name}"></td>
                    <td th:text="${cert.physician.position}"></td>
                    <td th:text="${cert.procedure.name}"></td>
                    <td th:text="${cert.procedure.cost}"></td>
                    <td th:text="${#temporals.format(cert.certificationDate, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${#temporals.format(cert.certificationExpires, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/trainedIn/certifications/edit/{physicianId}/{procedureId}(physicianId=${cert.physician.employeeId}, procedureId=${cert.procedure.code})}" class="btn btn-sm btn-primary">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:unless="${not #lists.isEmpty(appointments)}" class="alert alert-info mt-3">
        Please select a date range and search to view certifications.
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation" th:if="${not #lists.isEmpty(appointments)}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageResponse.first} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/trainedIn/dates(page=${pageResponse.pageNumber - 1}, size=${pageResponse.pageSize}, startDate=${startDateStr}, endDate=${endDateStr})}" aria-label="Previous">
                    <span aria-hidden="true">«</span>
                </a>
            </li>
            <li class="page-item" th:classappend="${pageResponse.last} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/trainedIn/dates(page=${pageResponse.pageNumber + 1}, size=${pageResponse.pageSize}, startDate=${startDateStr}, endDate=${endDateStr})}" aria-label="Next">
                    <span aria-hidden="true">»</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
