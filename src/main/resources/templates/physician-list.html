<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Physician List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Physician<span th:text="${selectedDeptName}"></span></h2>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Position</th>
            <th>SSN</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="physician : ${physicians}">
            <td th:text="${physician.employeeId}"></td>
            <td th:text="${physician.name}"></td>
            <td th:text="${physician.position}"></td>
            <td th:text="${physician.ssn}"></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/show-departments}" class="btn btn-secondary mt-3">⬅ Back to Departments</a>
</div>
</body>
</html>
