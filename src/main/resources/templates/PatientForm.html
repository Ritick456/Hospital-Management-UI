<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Patient' : 'Add New Patient'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${isEdit} ? 'Edit Patient' : 'Add New Patient'"></h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="${isEdit} ? @{/patients/update} : @{/patients/insert}" th:object="${patient}" method="post">
        <div class="mb-3">
            <label for="ssn" class="form-label">SSN</label>
            <input type="number" class="form-control" id="ssn" th:field="*{ssn}" th:readonly="${isEdit}" th:required="${!isEdit}">
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" th:readonly="${isEdit}" th:required="${!isEdit}">
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" th:field="*{address}" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" th:field="*{phone}" required>
        </div>
        <div class="mb-3">
            <label for="insuranceId" class="form-label">Insurance ID</label>
            <input type="text" class="form-control" id="insuranceId" th:field="*{insuranceId}" th:readonly="${isEdit}" th:required="${!isEdit}">
        </div>
        <div class="mb-3" th:if="${!isEdit}">
            <label for="pcpId" class="form-label">PCP ID</label>
            <input type="number" class="form-control" id="pcpId" th:field="*{pcpId}" required>
        </div>
        <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Save'"></button>
        <a th:href="@{/patients}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
