<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Patient' : 'Add Patient'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${isEdit} ? 'Edit Patient' : 'Add Patient'"></h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="${isEdit} ? '/patients/update' : '/patients/insert'" th:object="${patient}" method="post">
        <div class="mb-3">
            <label for="ssn" class="form-label">SSN</label>
            <input type="number" class="form-control" id="ssn" th:field="*{ssn}"
                   th:readonly="${isEdit}" th:required="${!isEdit}" min="100000000" max="999999999"
                   pattern="\d{9}" title="SSN must be a 9-digit number">
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}"
                   th:readonly="${isEdit}" th:required="${!isEdit}" maxlength="100">
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" th:field="*{address}"
                   required maxlength="200">
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" th:field="*{phone}">

        </div>
        <div class="mb-3">
            <label for="insuranceId" class="form-label">Insurance ID</label>
            <input type="number" class="form-control" id="insuranceId" th:field="*{insuranceId}"
                   th:readonly="${isEdit}" th:required="${!isEdit}" min="1" max="999999999"
                   title="Insurance ID must be up to 9 digits">
        </div>
        <div class="mb-3" th:unless="${isEdit}">
            <label for="pcpId" class="form-label">PCP ID</label>
            <input type="number" class="form-control" id="pcpId" th:field="*{pcpId}"
                   required min="1" title="PCP ID must be a positive number">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a th:href="@{/patients}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
