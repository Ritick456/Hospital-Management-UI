<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Hospital Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column align-items-center min-vh-100 py-4">

  <!-- Header -->
  <div class="container mb-4">
    <div class="bg-white shadow-sm rounded-4 p-4 text-center">
      <h1 class="fw-bold text-black display-5 text-uppercase">
        🏥 Hospital <span class="text-black">Management</span> <span class="text-black">System</span>
      </h1>
    </div>
  </div>

  <!-- Tiles -->
  <div class="container">
    <div class="row row-cols-2 row-cols-md-3 g-3 justify-content-center">

      <!-- ASHU -->
      <div class="col">
        <a href="/nurses" class="text-decoration-none">
          <div class="card border-0 bg-info bg-opacity-25 shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">ASHU</h6>
          </div>
        </a>
      </div>

      <!-- AMAN -->
      <div class="col">
        <a href="/aman" class="text-decoration-none">
          <div class="card border-0 bg-warning bg-opacity-25 shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">AMAN</h6>
          </div>
        </a>
      </div>

      <!-- RITURAJ -->
      <div class="col">
        <a href="/trainedIn/certifications" class="text-decoration-none">
          <div class="card border-0 bg-danger bg-opacity-25 shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">RITURAJ</h6>
          </div>
        </a>
      </div>

      <!-- ADITI -->
      <div class="col">
        <a href="/patients" class="text-decoration-none">
          <div class="card border-0 bg-primary bg-opacity-25 shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">ADITI</h6>
          </div>
        </a>
      </div>

      <!-- AMOLDEEP (soft unique color) -->
      <div class="col">
        <a href="/physicians" class="text-decoration-none">
          <div class="card border-0 bg-success-subtle shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">AMOLDEEP</h6>
          </div>
        </a>
      </div>

      <!-- RITICK -->
      <div class="col">
        <a href="/show-departments" class="text-decoration-none">
          <div class="card border-0 bg-success bg-opacity-25 shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">RITICK</h6>
          </div>
        </a>
      </div>

      <!-- HARSHIT -->
      <div class="col">
        <a href="/person/John%20Doe" class="text-decoration-none">
          <div class="card border-0 bg-secondary bg-opacity-25 shadow-sm text-center d-flex justify-content-center align-items-center" style="height: 90px;">
            <h6 class="fw-bold text-dark mb-0">HARSHIT</h6>
          </div>
        </a>
      </div>

    </div>
  </div>

</body>
</html>
