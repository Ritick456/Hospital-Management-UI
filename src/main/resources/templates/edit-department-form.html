<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Department</title>
    <!-- ✅ Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4">Edit Department Head</h2>

    <!--    &lt;!&ndash; ✅ Debug Info &ndash;&gt;-->
    <!--    <div class="alert alert-secondary">-->
    <!--        <strong>Debug:</strong> Department ID = <span th:text="${department.departmentId}">N/A</span>-->
    <!--    </div>-->

    <form th:action="@{'/department/update/' + ${department.departmentId}}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="physician" class="form-label">Select Head Physician:</label>
            <select name="physicianId" id="physician" class="form-select">
                <option th:each="physician : ${physicians}"
                        th:value="${physician.employeeId}"
                        th:text="${physician.name + ' (' + physician.position + ')'}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>

<!-- ✅ Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
