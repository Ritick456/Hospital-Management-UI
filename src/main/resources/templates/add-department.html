<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Department</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>Add Department</h2>
  <form th:action="@{/create-department}" method="post" th:object="${department}">
    <div class="mb-3">
      <label>Department ID</label>
      <input type="number" class="form-control" th:field="*{deptId}" required/>
    </div>

    <div class="mb-3">
      <label>Name</label>
      <input type="text" class="form-control" th:field="*{name}" required/>
    </div>

    <h5>Head of Department</h5>
    <div class="mb-3">
      <label>Head Employee ID</label>
      <input type="number" class="form-control" th:field="*{head.employeeId}"/>
    </div>
    <div class="mb-3">
      <label>Head Name</label>
      <input type="text" class="form-control" th:field="*{head.name}"/>
    </div>
    <div class="mb-3">
      <label>Position</label>
      <input type="text" class="form-control" th:field="*{head.position}"/>
    </div>
    <div class="mb-3">
      <label>SSN</label>
      <input type="number" class="form-control" th:field="*{head.ssn}"/>
    </div>

    <h5>Affiliated Physician</h5>
    <div th:each="aff, iterStat : *{affiliatedPhysicians}">
      <div class="mb-3">
        <label>Physician ID</label>
        <input type="number" class="form-control" th:field="*{affiliatedPhysicians[__${iterStat.index}__].employeeId}"/>
      </div>
      <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" th:field="*{affiliatedPhysicians[__${iterStat.index}__].name}"/>
      </div>
      <div class="mb-3">
        <label>Position</label>
        <input type="text" class="form-control" th:field="*{affiliatedPhysicians[__${iterStat.index}__].position}"/>
      </div>
      <div class="mb-3">
        <label>SSN</label>
        <input type="number" class="form-control" th:field="*{affiliatedPhysicians[__${iterStat.index}__].ssn}"/>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" th:field="*{affiliatedPhysicians[__${iterStat.index}__].primaryAffiliation}"/>
        <label class="form-check-label">Primary Affiliation</label>
      </div>
    </div>

    <button type="submit" class="btn btn-success">Create Department</button>
    <a href="/show-departments" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
