<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Department List</title>
    <!-- ✅ Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <div class="container my-5">
        <div class="row mb-3">
            <div class="col-md-6">
                <h2 class="mb-0">Hospital Departments</h2>
            </div>
            <div class="col-md-6 d-flex justify-content-end align-items-center">
                <form th:action="@{/department/search-physician}" method="get" class="d-flex align-items-center">
                    <label for="deptId" class="me-2 fw-bold mb-0">Select Department:</label>
                    <select name="deptId" id="deptId" class="form-select me-2" style="width: 200px;" required>
                        <option value="" disabled selected>Select...</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept.departmentId}"
                                th:text="${dept.name}">
                        </option>
                    </select>
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>
            </div>
        </div>


        <div class="text-start mb-3">
            <a class="btn btn-success" th:href="@{/show-add-department-form}">➕ Add New Department</a>

        </div>

        <!-- Department Table -->
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>Department ID</th>
                <th>Department Name</th>
                <th>Head Physician Name</th>
                <th>SSN</th>
                <th>Position</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dept : ${departments}">
                <td th:text="${dept.departmentId}"></td>
                <td th:text="${dept.name}"></td>
                <td th:text="${dept.physicianDetail?.name}">N/A</td>
                <td th:text="${dept.physicianDetail?.ssn}">N/A</td>
                <td th:text="${dept.physicianDetail?.position}">N/A</td>
                <td>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{'/department/edit/' + ${dept.departmentId}}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Display Search Result (if any) -->
        <!--    <div th:if="${physician}">-->
        <!--        <h5>Physician Found for Department:</h5>-->
        <!--        <p><strong>Name:</strong> <span th:text="${physician.name}"></span></p>-->
        <!--        <p><strong>SSN:</strong> <span th:text="${physician.ssn}"></span></p>-->
        <!--        <p><strong>Position:</strong> <span th:text="${physician.position}"></span></p>-->
        <!--    </div>-->

        <div th:if="${notFound}">
            <p class="text-danger" th:text="${notFound}"></p>
        </div>
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i} == ${currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/show-departments(page=${i}, size=5)}"
                   th:text="${i + 1}">1</a>
            </li>
        </ul>
    </nav>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
