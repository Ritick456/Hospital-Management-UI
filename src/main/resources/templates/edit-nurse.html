<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Nurse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4">✏️ Edit Nurse</h2>

  <form th:action="@{/nurses/update}" th:object="${nurse}" method="post" class="card p-4 shadow">
    
    <!-- Hidden Employee ID -->
    <input type="hidden" name="employeeId" th:value="${nurse.employeeId}" />

    <!-- Optional: Display Employee ID (for debugging) -->
    <div class="mb-3">
      <label for="employeeId">Employee ID</label>
      <input type="text" th:value="${nurse.employeeId}" class="form-control" id="employeeId" readonly/>
    </div>

    <!-- ✅ Name Field -->
    <div class="mb-3">
      <label for="name">Name</label>
      <input type="text" th:field="*{name}" class="form-control" id="name"/>
    </div>

    <div class="mb-3">
      <label for="position">Position</label>
      <input type="text" th:field="*{position}" class="form-control" id="position"/>
    </div>

    <div class="mb-3">
      <label for="ssn">SSN</label>
      <input type="number" th:field="*{ssn}" class="form-control" id="ssn"/>
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" th:field="*{registered}" class="form-check-input" id="registered"/>
      <label class="form-check-label" for="registered">Registered</label>
    </div>

    <div class="d-flex justify-content-between">
      <a th:href="@{/nurses}" class="btn btn-secondary">⬅ Back</a>
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>
    </div>
  </form>
</div>

</body>
</html>
