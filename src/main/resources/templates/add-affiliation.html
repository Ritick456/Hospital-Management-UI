<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Affiliation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Add New Affiliation</h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <a th:href="@{/aman/}" class="btn btn-secondary mb-3">Back to Affiliations</a>
    <form th:action="@{/aman/add-affiliation}" th:object="${affiliatedWithDto}" method="post">
        <div class="mb-3">
            <label for="physicianId" class="form-label">Physician</label>
            <select class="form-select" id="physicianId" th:field="*{physicianId}">
                <option value="">Select Physician</option>
                <option th:each="physician : ${physicians}" th:value="${physician.employeeId}" th:text="${physician.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="departmentId" class="form-label">Department</label>
            <select class="form-select" id="departmentId" th:field="*{departmentId}">
                <option value="">Select Department</option>
                <option th:each="department : ${departments}" th:value="${department.departmentId}" th:text="${department.name}"></option>
            </select>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="primaryAffiliation" th:field="*{primaryAffiliation}">
            <label class="form-check-label" for="primaryAffiliation">Primary Affiliation</label>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
