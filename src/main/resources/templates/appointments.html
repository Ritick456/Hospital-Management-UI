<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointment Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- 🔼 HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow mb-3">
    <div class="container-fluid justify-content-between">
        <span class="navbar-brand">📅 Appointment Directory</span>
        <div class="d-flex align-items-center gap-3" th:if="${message == null}">
            <form method="get" action="/appointments" class="d-flex align-items-center">
                <input type="hidden" name="page" value="0" />
                <input type="hidden" name="sort" th:value="${sort}" />
                <label class="text-white me-2 mb-0">Rows:</label>
                <select class="form-select form-select-sm w-auto" name="size" onchange="this.form.submit()">
                    <option th:selected="${pageSize == 2}" value="2">2</option>
                    <option th:selected="${pageSize == 5}" value="5">5</option>
                    <option th:selected="${pageSize == 10}" value="10">10</option>
                </select>
            </form>
            <a href="/appointments/add" class="btn btn-success">➕ Add Appointment</a>
        </div>
    </div>
</nav>

<!-- 🧾 BODY -->
<main class="container flex-fill">

    <!-- ❗ Message Block (Error or Info) -->
    <div th:if="${message}" class="alert alert-danger text-center">
        <p th:text="${message}">Something went wrong.</p>
    </div>

    <!-- 📋 Appointment Cards -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
         th:if="${message == null and appointments != null and !appointments.isEmpty()}">
        <div class="col" th:each="appointment : ${appointments}">
            <div class="card h-100 shadow-sm border-0 rounded-4">
                <div class="card-body">
                    <h5 class="card-title text-primary fw-bold" th:text="'Appointment #' + ${appointment.appointmentId}">Appointment ID</h5>
                    <hr>
                    <ul class="list-unstyled text-muted mb-3">
                        <li><strong>🕒 Start:</strong> <span th:text="${appointment.start != null ? appointment.start : 'N/A'}">N/A</span></li>
                        <li><strong>🕔 End:</strong> <span th:text="${appointment.end != null ? appointment.end : 'N/A'}">N/A</span></li>
                        <li><strong>🏥 Room:</strong> <span th:text="${appointment.examinationRoom != null ? appointment.examinationRoom : 'N/A'}">N/A</span></li>
                        <li><strong>👨‍⚕️ Physician:</strong> <span th:text="${appointment.physician != null ? appointment.physician.name : 'N/A'}">N/A</span></li>
                        <li><strong>👩‍⚕️ Nurse:</strong> <span th:text="${appointment.nurse != null ? appointment.nurse.name : 'N/A'}">N/A</span></li>
                        <li><strong>🧑 Patient:</strong> <span th:text="${appointment.patient != null ? appointment.patient.name : 'N/A'}">N/A</span></li>
                    </ul>

                    <!-- 👇 Action Buttons -->
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/appointments/edit(id=${appointment.appointmentId})}"
                           class="btn btn-outline-primary btn-sm rounded-pill">✏️ Edit Appointment</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ❌ No Appointments -->
    <div th:if="${message == null and appointments != null and appointments.isEmpty()}" class="alert alert-warning text-center mt-4">
        🚫 No appointments found.
        <div class="mt-2">
            <a th:href="@{/appointments(page=0, size=${pageSize}, sort=${sort})}" class="btn btn-outline-secondary btn-sm">🔄 Reset</a>
        </div>
    </div>

    <!-- ⏮️ Pagination -->
    <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap" th:if="${message == null}">
        <div class="text-muted mb-2">
            Page <span class="fw-bold" th:text="${currentPage + 1}">1</span>
        </div>
        <div class="d-flex gap-2 mb-2">
            <form method="get" action="/appointments">
                <input type="hidden" name="page" th:value="${currentPage - 1}" />
                <input type="hidden" name="size" th:value="${pageSize}" />
                <input type="hidden" name="sort" th:value="${sort}" />
                <button type="submit" class="btn btn-outline-secondary btn-sm"
                        th:attr="disabled=${currentPage == 0} ? 'disabled' : null">⬅️ Previous</button>
            </form>

            <form method="get" action="/appointments">
                <input type="hidden" name="page" th:value="${currentPage + 1}" />
                <input type="hidden" name="size" th:value="${pageSize}" />
                <input type="hidden" name="sort" th:value="${sort}" />
                <button type="submit" class="btn btn-outline-secondary btn-sm"
                        th:attr="disabled=${isLastPage} ? 'disabled' : null">Next ➡️</button>
            </form>
        </div>
    </div>

</main>

<!-- 🔽 FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-4">
    <small>© 2025 Hospital Management System</small>
</footer>

</body>
</html>
