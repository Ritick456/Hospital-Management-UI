<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Physician Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="mb-4 text-center">Physician Records</h2>

    <!-- Alerts -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Update Physician Table -->
    <form th:action="@{/physicians/update}" method="post">
        <table class="table table-hover table-bordered bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>Select</th>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>SSN</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="physician : ${physicians}">
                <td>
                    <input type="radio" name="selectedEmpId" th:value="${physician.employeeId}" required />
                </td>
                <td th:text="${physician.employeeId}">1</td>
                <td>
                    <input type="text"
                           th:name="'names[' + ${physician.employeeId} + ']'"
                           th:value="${physician.name}"
                           class="form-control" />
                </td>
                <td>
                    <input type="text"
                           th:name="'positions[' + ${physician.employeeId} + ']'"
                           th:value="${physician.position}"
                           class="form-control" />
                </td>
                <td>
                    <input type="text"
                           th:name="'ssns[' + ${physician.employeeId} + ']'"
                           th:value="${physician.ssn}"
                           class="form-control" />
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-end mb-4">
            <button type="submit" class="btn btn-success">Update Physician</button>
        </div>
    </form>

    <!-- Add Physician Form -->
    <form th:action="@{/physicians/add}" th:object="${newPhysician}" method="post" class="border p-4 bg-white rounded shadow-sm">
        <h5>Add New Physician</h5>
        <div class="row g-2">
            <div class="col-md-2">
                <input type="number" th:field="*{employeeId}" placeholder="Employee ID" class="form-control" required />
                <small class="text-muted">Enter unique ID not already in use</small>
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{name}" placeholder="Name" class="form-control" required />
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{position}" placeholder="Position" class="form-control" required />
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{ssn}" placeholder="SSN" class="form-control" required />
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
